[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-code-cli"
version = "0.3.0"
description = "DCS Code CLI — a terminal AI coding assistant powered by a LiteLLM proxy, with git and GitLab integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aicoder contributors" }]
keywords = ["ai", "cli", "coding", "assistant", "litellm", "gitlab"]
dependencies = [
    "openai>=1.30",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# System certificate-store trust (e.g. for Zscaler), used by --system-certs.
certs = ["truststore>=0.9"]

[project.scripts]
dcs = "aicoder.cli:main"
aicoder = "aicoder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aicoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
