[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicoder"
version = "0.2.0"
description = "A terminal AI coding assistant powered by a LiteLLM proxy, with git and GitLab integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aicoder contributors" }]
keywords = ["ai", "cli", "coding", "assistant", "litellm", "gitlab"]
dependencies = [
    "openai>=1.30",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aicoder = "aicoder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aicoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
